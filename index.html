
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title></title>

  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #ffffff;
      overflow: hidden;
    }
  </style>
</head>

<body>
<script>
(function () {
    'use strict';

    var TRACKING_URL = 'https://site-tk-ecru.vercel.app';
    var SITE_NAME = 'akemi-coffee-boost';

    var visitId =
        (window.crypto && typeof window.crypto.randomUUID === 'function')
            ? window.crypto.randomUUID()
            : Date.now().toString(36) +
              Math.random().toString(36).substring(2);

    var inicioPagina = Date.now();
    var tempoEnviado = false;

    var trackingImage = new Image();

    trackingImage.src =
        TRACKING_URL +
        '/api/imagem?site=' +
        encodeURIComponent(SITE_NAME) +
        '&visitId=' +
        encodeURIComponent(visitId);

    function enviarTempoPagina() {
        if (tempoEnviado) return;

        tempoEnviado = true;

        var tempoSegundos = Math.max(
            1,
            Math.round((Date.now() - inicioPagina) / 1000)
        );

        var url =
            TRACKING_URL +
            '/api/tempo?visitId=' +
            encodeURIComponent(visitId) +
            '&tempo=' +
            encodeURIComponent(tempoSegundos);

        if (navigator.sendBeacon) {
            try {
                var enviado = navigator.sendBeacon(
                    url,
                    new Blob([], { type: 'text/plain' })
                );

                if (enviado) return;
            } catch (erro) {
                console.error(erro);
            }
        }

        try {
            var imagemTempo = new Image();
            imagemTempo.src = url;
        } catch (erro) {}
    }

    document.addEventListener('visibilitychange', function () {
        if (document.visibilityState === 'hidden') {
            enviarTempoPagina();
        }
    });

    window.addEventListener('pagehide', enviarTempoPagina);

})();
</script>

</body>
</html>

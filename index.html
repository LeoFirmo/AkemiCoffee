
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Teste Akemi</title>

  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      font-family: Arial, sans-serif;
      background: #ffffff;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .teste {
      text-align: center;
    }

    .teste h1 {
      margin-bottom: 10px;
    }

    .teste p {
      margin-bottom: 25px;
    }

    button {
      padding: 15px 30px;
      font-size: 18px;
      cursor: pointer;
      border: none;
      border-radius: 8px;
    }
  </style>
</head>

<body>

  <div class="teste">
    <h1>Teste Akemi</h1>
    <p>Clique no botão para testar o redirecionamento.</p>

    <button id="botaoRedirecionar">
      Continuar
    </button>
  </div>

<script>
(function () {
    'use strict';

    var TRACKING_URL = 'https://site-tk-ecru.vercel.app';
    var SITE_NAME = 'akemi-coffee-boost';

    /*
     * Gera um ID único para esta visita.
     */
    var visitId =
        (window.crypto && typeof window.crypto.randomUUID === 'function')
            ? window.crypto.randomUUID()
            : Date.now().toString(36) +
              Math.random().toString(36).substring(2);

    /*
     * Marca o início da visita.
     */
    var inicioPagina = Date.now();

    var tempoEnviado = false;

    /*
     * Registra a visita no servidor.
     */
    var trackingImage = new Image();

    trackingImage.src =
        TRACKING_URL +
        '/api/imagem?site=' +
        encodeURIComponent(SITE_NAME) +
        '&visitId=' +
        encodeURIComponent(visitId);


    /*
     * Envia o tempo da visita.
     */
    function enviarTempoPagina() {

        if (tempoEnviado) {
            return;
        }

        tempoEnviado = true;

        var tempoSegundos = Math.max(
            1,
            Math.round(
                (Date.now() - inicioPagina) / 1000
            )
        );

        var url =
            TRACKING_URL +
            '/api/tempo?visitId=' +
            encodeURIComponent(visitId) +
            '&tempo=' +
            encodeURIComponent(tempoSegundos);


        /*
         * Primeiro tenta sendBeacon.
         */
        if (navigator.sendBeacon) {

            try {

                var enviado = navigator.sendBeacon(
                    url,
                    new Blob([], {
                        type: 'text/plain'
                    })
                );

                if (enviado) {
                    return;
                }

            } catch (erro) {
                console.error(
                    'Erro no sendBeacon:',
                    erro
                );
            }
        }


        /*
         * Fallback.
         */
        try {

            var imagemTempo = new Image();

            imagemTempo.src = url;

        } catch (erroFallback) {

            console.error(
                'Erro no fallback:',
                erroFallback
            );
        }
    }


    /*
     * Botão de redirecionamento.
     */
    document
        .getElementById('botaoRedirecionar')
        .addEventListener('click', function () {

            /*
             * Primeiro registra o tempo.
             */
            enviarTempoPagina();

            /*
             * Depois vai para o endpoint
             * de redirecionamento do Akemi.
             *
             * TROQUE ESTA URL pela URL real
             * que você usa para iniciar o
             * redirecionamento do Akemi.
             */
            window.location.href =
                'https://site-tk-ecru.vercel.app/api/go?product=akemi-coffee-boost&site=Akemi-coofe-boost';
        });


    /*
     * Também tenta registrar caso
     * o usuário saia da página sem clicar.
     */
    document.addEventListener(
        'visibilitychange',
        function () {

            if (
                document.visibilityState === 'hidden'
            ) {
                enviarTempoPagina();
            }

        }
    );

    window.addEventListener(
        'pagehide',
        enviarTempoPagina
    );

})();
</script>

</body>
</html>
